<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR-светильник</title>
  <script type="module"
    src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    model-viewer { width: 100%; height: 80vh; }
  </style>
</head>
<body>
  <model-viewer
    src="sconce.glb"
    ios-src="sconce.usdz"
    ar-placement="wall"
    alt="3D-модель светильника"
    ar
    ar-modes="webxr scene-viewer quick-look"
    environment-image="room.hdr"
    camera-controls
    shadow-intensity="1">
  </model-viewer>
</body>
</html>
